# config/node_maintenance.vars.conf
# ==============================================================================
# Settings for scripts/biome_node_maintenance.sh: OS updates (unattended-upgrades)
# and the rstudio-server restart they need, only in the night window and only
# when the node is free (ADR-0007). Site values go in
# config/site/node_maintenance.site.vars.conf (gitignored), read after this
# file. Every key can also be set in the environment.
# ==============================================================================

# Night window, local time, HHMM. The timer fires every 15 minutes from the
# hour of MAINT_WINDOW_START to MAINT_WINDOW_END; slots before
# MAINT_WINDOW_START only log. Same window as the R package sync
# (config/pkg_sync.vars.conf): the two jobs never run at the same time on a
# node (see MAINT_PKG_SYNC_LOCK), and no node waits for another.
MAINT_WINDOW_START="${MAINT_WINDOW_START:-0330}"
MAINT_WINDOW_END="${MAINT_WINDOW_END:-0500}"

# After this many nights in a row without a free slot, every deferred run logs
# a warning to the journal (priority warning, tag biome-node-maintenance) and
# the report status becomes "overdue": security updates are waiting.
MAINT_OVERDUE_NIGHTS="${MAINT_OVERDUE_NIGHTS:-3}"

# true = after the upgrade, restart rstudio-server when needrestart says it
# runs outdated libraries AND the node is still free. false = only report it.
MAINT_RESTART_RSTUDIO="${MAINT_RESTART_RSTUDIO:-true}"

# Lock file of scripts/biome_pkg_sync.sh (its LOCK_FILE default). While the
# sync holds it, this job defers to the next slot.
MAINT_PKG_SYNC_LOCK="${MAINT_PKG_SYNC_LOCK:-/run/lock/biome-pkg-sync.lock}"

# Local state and reports.
MAINT_STATE_DIR="${MAINT_STATE_DIR:-/var/lib/biome-node-maintenance}"
