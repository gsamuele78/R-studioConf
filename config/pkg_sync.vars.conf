# config/pkg_sync.vars.conf
# ==============================================================================
# Settings for scripts/biome_pkg_sync.sh: nightly R package sync across hosts
# (ADR-0004 step 4). Site values (the real shared path, the mode) go in
# config/site/pkg_sync.site.vars.conf, which is gitignored and read after this
# file. Every key can also be set in the environment.
# ==============================================================================

# Shared directory on biome-store03, mounted on every host, writable by root.
# Empty = not configured: the script refuses to run.
PKG_SYNC_DIR="${PKG_SYNC_DIR:-}"

# dry-run = publish the manifest and log the plan, change nothing.
# apply   = also install missing packages and align versions.
# Start every host in dry-run; switch the test host (calc04) to apply first.
PKG_SYNC_MODE="${PKG_SYNC_MODE:-dry-run}"

# Night window, local time, HHMM. The timer fires every 15 minutes from the
# hour of PKG_SYNC_WINDOW_START to PKG_SYNC_WINDOW_END. Slots before
# PKG_SYNC_APPLY_FROM only publish the manifest (03:00, 03:15), so every host
# has published before any host reads the others. From PKG_SYNC_APPLY_FROM a
# run that finds R sessions defers to the next slot (03:30, 03:45 ... 04:45);
# if the last slot is still busy the sync moves to the next night.
PKG_SYNC_WINDOW_START="${PKG_SYNC_WINDOW_START:-0300}"
PKG_SYNC_WINDOW_END="${PKG_SYNC_WINDOW_END:-0500}"
PKG_SYNC_APPLY_FROM="${PKG_SYNC_APPLY_FROM:-0330}"

# At most this many missing packages installed per night (the rest the next
# night), so one run stays short.
PKG_SYNC_MAX_NEW="${PKG_SYNC_MAX_NEW:-50}"

# Manifests older than this are ignored (host down or timer broken).
PKG_SYNC_MAX_AGE_HOURS="${PKG_SYNC_MAX_AGE_HOURS:-36}"

# Passed to fix_r_pkg_versions_inplace.sh: allow upgrades whose old .deb cannot
# be saved for rollback. false = such upgrades wait for an operator decision.
PKG_SYNC_ACCEPT_PARTIAL_ROLLBACK="${PKG_SYNC_ACCEPT_PARTIAL_ROLLBACK:-false}"

# A researcher (domain) account that must NOT be able to write PKG_SYNC_DIR.
# --check-dir tries to write as this user and as 'nobody'; 'nobody' is in no
# AD group, so only a real account catches an ACL that grants a group write.
PKG_SYNC_TEST_USER="${PKG_SYNC_TEST_USER:-}"

# Local state, logs and backups.
PKG_SYNC_STATE_DIR="${PKG_SYNC_STATE_DIR:-/var/lib/biome-pkg-sync}"
PKG_SYNC_BACKUP_ROOT="${PKG_SYNC_BACKUP_ROOT:-/var/backups/biome-calc}"

# Libraries scanned for packages that apt does not manage (reported, never synced).
PKG_SYNC_OTHER_LIBS="${PKG_SYNC_OTHER_LIBS:-/usr/local/lib/R/site-library}"
