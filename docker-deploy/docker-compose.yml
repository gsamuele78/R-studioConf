# x-logging: centralised YAML anchor for all services (HC-06)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ------------------------------------------------------------------
  # rstudio-init  (one-shot, service_completed_successfully)
  #
  # Responsibilities:
  #   1. Create bind-mount directories with correct permissions
  #   2. Fetch PKI Root CA from Step-CA (if configured)
  #   3. Validate prerequisite files exist before services start
  #
  # This mirrors the iam-init / ood-init pattern from infra-iam / infra-ood.
  # ------------------------------------------------------------------
  rstudio-init:
    image: curlimages/curl:8.22.0
    container_name: rstudio_init
    restart: "no"
    network_mode: "host"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    entrypoint: /bin/sh
    command: >
      -c "
        echo '--- RStudio Init ---';
        echo 'Verifying PKI trust certificate...';
        CERT='${STEP_CA_ROOT_PATH:-/etc/ssl/certs/step-ca-root.crt}';
        if [ -f \"$$CERT\" ]; then
          echo \"PKI Root CA found at $$CERT\";
        else
          echo \"WARN: PKI Root CA not found at $$CERT — services may fail TLS verification\";
        fi;
        echo '--- RStudio Init Complete ---';
      "
    logging: *default-logging

  # ------------------------------------------------------------------
  # Docker Socket Proxy (HC-09 Isolation)
  # Exposes Docker API read-only for telemetry-api.
  # Prevents direct docker.sock mount in application containers.
  # ------------------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: rstudio_socket_proxy
    restart: unless-stopped
    # NOT on the host network: the image binds [::]:2375 unconditionally (its
    # entrypoint overwrites BIND_CONFIG), which would expose the Docker API to the
    # LAN. It lives on its own bridge and is published on loopback only; the
    # host-network telemetry service reaches it at tcp://127.0.0.1:2375.
    networks: [ rstudio-proxy-net ]
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      - CONTAINERS=1   # Allow read-only access to containers API
      - INFO=1
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping | grep -q OK" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging: *default-logging

  # --- RStudio Service (SSSD Backend) ---
  rstudio-sssd:
    profiles: [ "sssd" ]
    build:
      context: .
      dockerfile: Dockerfile.sssd
    image: ${RSTUDIO_SSSD_IMAGE:-rstudio-botanical-sssd}:${IMAGE_TAG}
    container_name: rstudio_pet
    restart: unless-stopped
    network_mode: "host"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${RSTUDIO_MEMORY_LIMIT:-16G}
          cpus: ${RSTUDIO_CPU_LIMIT:-4.0}
    cap_drop:
      - SYS_CHROOT
    # Translate /etc/fstab /tmp ramdisk to Docker tmpfs
    tmpfs:
      - /tmp:rw,size=${RAMDISK_SIZE:-16G},uid=0,gid=0,mode=1777
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://127.0.0.1:${RSTUDIO_PORT:-8787}/auth-sign-in || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - AUTH_BACKEND=sssd
      - USERID=${DOCKER_USERID:-1000}
      - GROUPID=${DOCKER_GROUPID:-1000}
      - MAX_BLAS_THREADS=${MAX_BLAS_THREADS:-16}
      - BIOME_CONTACT=${BIOME_CONTACT:-support@botanical.example.com}
      - BIOME_CONF=${BIOME_CONF:-/etc/biome-calc}
    volumes:
      - ${HOST_HOME_DIR}:/home
      - ${HOST_PROJECT_ROOT}:/nfs/home
      # T1 collector cache; read-only mirror for status()/biome_quota() (no collector in container)
      - ${HOST_QUOTA_CACHE_DIR:-/var/lib/biome-quota}:/var/lib/biome-quota:ro
      - ${HOST_SSS_PIPES:-/var/lib/sss/pipes}:/var/lib/sss/pipes:rw
      - ${HOST_SSS_MC:-/var/lib/sss/mc}:/var/lib/sss/mc:ro
      - ${HOST_SSSD_CONF:-/etc/sssd/sssd.conf}:/etc/sssd/sssd.conf:ro
      - ${HOST_KRB5_CONF:-/etc/krb5.conf}:/etc/krb5.conf:ro
      - ${HOST_NSSWITCH_CONF:-/etc/nsswitch.conf}:/etc/nsswitch.conf:ro
      # Step-CA Root Trust
      - ${STEP_CA_ROOT_PATH:-/etc/ssl/certs/step-ca-root.crt}:/usr/local/share/ca-certificates/step-ca-root.crt:ro
      # Python Geospatial Venv
      - ${PYTHON_ENV:-/opt/r-geospatial}:/opt/r-geospatial:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      rstudio-init:
        condition: service_completed_successfully

  # --- RStudio Service (Samba Backend) ---
  rstudio-samba:
    profiles: [ "samba" ]
    build:
      context: .
      dockerfile: Dockerfile.samba
    image: ${RSTUDIO_SAMBA_IMAGE:-rstudio-botanical-samba}:${IMAGE_TAG}
    container_name: rstudio_pet
    restart: unless-stopped
    network_mode: "host"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${RSTUDIO_MEMORY_LIMIT:-16G}
          cpus: ${RSTUDIO_CPU_LIMIT:-4.0}
    cap_drop:
      - SYS_CHROOT
    # Translate /etc/fstab /tmp ramdisk to Docker tmpfs
    tmpfs:
      - /tmp:rw,size=${RAMDISK_SIZE:-16G},uid=0,gid=0,mode=1777
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://127.0.0.1:${RSTUDIO_PORT:-8787}/auth-sign-in || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - AUTH_BACKEND=samba
      - MAX_BLAS_THREADS=${MAX_BLAS_THREADS:-16}
      - BIOME_CONTACT=${BIOME_CONTACT:-support@botanical.example.com}
      - BIOME_CONF=${BIOME_CONF:-/etc/biome-calc}
    volumes:
      - ${HOST_HOME_DIR}:/home
      - ${HOST_PROJECT_ROOT}:/nfs/home
      # T1 collector cache; read-only mirror for status()/biome_quota() (no collector in container)
      - ${HOST_QUOTA_CACHE_DIR:-/var/lib/biome-quota}:/var/lib/biome-quota:ro
      - ${HOST_WINBINDD_DIR:-/var/run/samba/winbindd}:/var/run/samba/winbindd:rw
      - ${HOST_SAMBA_DIR:-/var/lib/samba}:/var/lib/samba:rw
      - ${HOST_SMB_CONF:-/etc/samba/smb.conf}:/etc/samba/smb.conf:ro
      - ${HOST_KRB5_CONF:-/etc/krb5.conf}:/etc/krb5.conf:ro
      - ${HOST_NSSWITCH_CONF:-/etc/nsswitch.conf}:/etc/nsswitch.conf:ro
      # Step-CA Root Trust
      - ${STEP_CA_ROOT_PATH:-/etc/ssl/certs/step-ca-root.crt}:/usr/local/share/ca-certificates/step-ca-root.crt:ro
      # Python Geospatial Venv
      - ${PYTHON_ENV:-/opt/r-geospatial}:/opt/r-geospatial:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      rstudio-init:
        condition: service_completed_successfully

  # --- Nginx Portal Service ---
  nginx-portal:
    profiles: [ "portal" ]
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: ${PORTAL_NGINX_IMAGE:-botanical-portal-nginx}:${IMAGE_TAG}
    container_name: nginx_portal
    restart: unless-stopped
    network_mode: "host"
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEMORY_LIMIT:-256M}
          cpus: ${NGINX_CPU_LIMIT:-1.0}
    healthcheck:
      test: [ "CMD-SHELL", "curl -k -f -s https://localhost:${HTTPS_PORT:-443}/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ${SSL_CERT_PATH}:/etc/ssl/certs/server.crt:ro
      - ${SSL_KEY_PATH}:/etc/ssl/private/server.key:ro
      # Step-CA Root Trust
      - ${STEP_CA_ROOT_PATH:-/etc/ssl/certs/step-ca-root.crt}:/usr/local/share/ca-certificates/step-ca-root.crt:ro
    environment:
      - NGINX_HOST=${HOST_DOMAIN}
      - NGINX_PORT=${HTTPS_PORT}
      - RSTUDIO_PORT=${RSTUDIO_PORT}
      - ENABLE_TELEMETRY_STRIP=${ENABLE_TELEMETRY_STRIP:-true}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    depends_on:
      rstudio-init:
        condition: service_completed_successfully

  # --- OAuth2-Proxy Sidecar (OIDC Authentication) ---
  oauth2-proxy:
    profiles: [ "oidc" ]
    image: ${OAUTH2_PROXY_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy}:${OAUTH2_PROXY_TAG:-v7.6.0-alpine}
    container_name: oauth2_proxy
    restart: unless-stopped
    command:
      - --config=/etc/oauth2-proxy.cfg
    volumes:
      - ${OAUTH2_PROXY_CONFIG:-./config/oauth2-proxy.cfg}:/etc/oauth2-proxy.cfg:ro
    network_mode: "host"
    healthcheck:
      # -alpine tag: the default image is distroless and has no shell or wget.
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4180/ping >/dev/null" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${OAUTH2_MEMORY_LIMIT:-128M}
          cpus: ${OAUTH2_CPU_LIMIT:-0.5}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging: *default-logging
    depends_on:
      rstudio-init:
        condition: service_completed_successfully

  # --- Telemetry & Metrics API ---
  telemetry-api:
    profiles: [ "portal" ]
    build:
      context: .
      dockerfile: Dockerfile.telemetry
    image: ${TELEMETRY_API_IMAGE:-botanical-telemetry-api}:${IMAGE_TAG}
    container_name: telemetry_api
    restart: unless-stopped
    network_mode: "host"
    pid: "host"
    volumes:
      # Mount only specific paths instead of entire host root (least privilege)
      - ${TELEMETRY_NFS_HOME_HOST:-/nfs/home}:/hostfs/nfs/home:ro
      - ${TELEMETRY_PROJECTS_DIR_HOST:-/nfs/projects}:/hostfs/nfs/projects:ro
      - /tmp:/hostfs/tmp:ro
      - /proc:/hostfs/proc:ro
      - ${TELEMETRY_HOST_RUN:-/var/run}:/var/run:ro
      - ${ADMIN_RECIPIENTS_FILE:-./config/site/admin_recipients.txt}:/etc/biome-calc/conf/admin_recipients.txt:ro
    environment:
      - DOCKER_HOST=tcp://127.0.0.1:2375
      # Tell telemetry to look for disk paths on /hostfs
      - NFS_HOME=${TELEMETRY_NFS_HOME:-/hostfs/nfs/home}
      - PROJECTS_DIR=${TELEMETRY_PROJECTS_DIR:-/hostfs/nfs/projects}
      - TMP_DIR=${TELEMETRY_TMP_DIR:-/hostfs/tmp}
    deploy:
      resources:
        limits:
          memory: ${TELEMETRY_MEMORY_LIMIT:-512M}
          cpus: ${TELEMETRY_CPU_LIMIT:-1.0}
    depends_on:
      docker-socket-proxy:
        condition: service_started
      rstudio-init:
        condition: service_completed_successfully
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://127.0.0.1:8000/api/v1/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # --- Ollama AI Engine ---
  ollama-ai:
    profiles: [ "ai" ]
    build:
      context: .
      dockerfile: Dockerfile.ollama
    image: ${OLLAMA_AI_IMAGE:-botanical-ai-ollama}:${IMAGE_TAG}
    container_name: ollama_ai
    restart: on-failure
    network_mode: "host"
    environment:
      # We bind to 127.0.0.1 for security, RStudio will reach it locally
      - OLLAMA_HOST=${OLLAMA_HOST_BIND:-127.0.0.1:11434}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ${HOST_OLLAMA_STORAGE:-/var/lib/ollama}:/root/.ollama:rw
    deploy:
      resources:
        limits:
          # Protect host from unbounded AI inference core starvation
          memory: ${OLLAMA_RAM_LIMIT:-16G}
          cpus: ${OLLAMA_CPU_LIMIT:-2.5}
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "curl -f -s http://127.0.0.1:11434/api/version || exit 1" ]
      interval: 1m
      timeout: 15s
      retries: 5
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

# No named volumes — all bind mounts (HC-02)
# No version: key — Compose v2 does not need it (HC-09)

networks:
  # Only the docker-socket-proxy uses it; every other rstudio service stays on
  # network_mode: host (SSSD/Winbind socket passthrough, see doc/architecture/SYSTEM_OVERVIEW.md).
  rstudio-proxy-net:
    driver: bridge
