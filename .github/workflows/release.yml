# .github/workflows/release.yml
# Publish a GitHub Release when a vX.Y.Z tag is pushed. The notes are that
# version's section of CHANGELOG.md (pattern from Proxmox_biome_log_collector).
# Tags are created by the maintainer (or on his explicit request) after the
# release PR is merged; this workflow never creates or moves a tag.
#
# Hardening: only a vX.Y.Z tag is checked out (never a branch), the tagged
# commit must be on main, and the checkout keeps no credential, so repository
# code run here (the CHANGELOG gate) never sees the write token. The token is
# given only to the final `gh release create` step.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Tag name is vX.Y.Z
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a vX.Y.Z tag: $TAG" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Tagged commit is on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "refs/tags/${TAG}^{commit}" origin/main \
            || { echo "${TAG} points to a commit that is not on main" >&2; exit 1; }

      - name: CHANGELOG gate (the tag must have its section)
        run: bash tests/lint/check_changelog.sh --tag "$TAG"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "CHANGELOG.md has no '## [${version}]' section" >&2
            exit 1
          fi

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
