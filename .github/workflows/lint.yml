name: Fast Lint (ShellCheck + actionlint)

# ShellCheck at severity warning, like Infra-Iam-PKI (`shellcheck -x -S warning`),
# with a ratchet baseline so existing findings do not block (tests/lint/).
# actionlint checks every workflow file (and the shell inside `run:` blocks).

on:
  push:
    paths:
      - '**.sh'
      - '.github/workflows/**'
      - 'tests/lint/**'
      - 'Makefile'
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/**'
      - 'tests/lint/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck (warning, ratchet)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck v0.11.0 (checksum-verified; the baseline depends on the version)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - run: make shellcheck

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint v1.7.12 (checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
      - run: make actionlint
